<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Ultimate Admin | EA FC Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #f8d448; --blue: #0041FF; --red: #ff4444; --green: #00ff88; --bg: #050505; --card: #111; --border: #222; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0; }
        header { position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 10, 0.95); border-bottom: 1px solid var(--border); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .main-container { padding: 25px 5%; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; border: none; font-weight: 700; cursor: pointer; border-radius: 6px; text-transform: uppercase; margin-top: 5px; }
        .btn-yellow { background: var(--accent); color: black; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-outline { background: transparent; border: 1px solid #444; color: #888; }
        #toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; background: var(--green); color: black; border-radius: 8px; font-weight: bold; transform: translateY(100px); transition: 0.4s; z-index: 2000; }
        body {
    background: radial-gradient(circle at top, var(--pitch-navy) 0%, var(--bg-black) 100%);
    background-size: 200% 200%;
    animation: stadiumLights 10s ease infinite;
    background-attachment: fixed;
}

@keyframes stadiumLights {
    0% { background-position: 50% 0%; }
    50% { background-position: 50% 100%; }
    100% { background-position: 50% 0%; }
}
    </style>
</head>
<body>
    <div id="toast">Success!</div>
    <header>
        <div class="header-brand"><h2 style="color:var(--accent); margin:0;">MYSTIC ADMIN</h2><p style="margin:0; font-size:0.7rem; color:#555;">EA FC MOBILE EDITION</p></div>
        <button class="btn-outline" style="width:auto;" onclick="location.reload()">REFRESH</button>
    </header>

    <div class="main-container">
        <div class="dashboard-grid">
            
            <!-- 1. ADD PLAYER -->
            <div class="card" style="border-left: 4px solid var(--blue);">
                <h3><i class="fa-solid fa-user-plus"></i> Register Player</h3>
                <input type="text" id="newPlayerName" placeholder="Player Full Name">
                <input type="text" id="newPlayerImg" placeholder="Image URL (Direct Link)">
                <button onclick="addPlayer()" class="btn-blue" id="addPlayerBtn">Sync to Database</button>
            </div>

            <!-- 2. SCORING -->
            <div class="card" style="border-left: 4px solid var(--green);">
                <h3><i class="fa-solid fa-ranking-star"></i> Scoring</h3>
                <select id="playerSelect"><option>Loading...</option></select>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
                    <button onclick="rankAction('update-points', {result:'win'})" style="background:var(--green); color:black;">WIN</button>
                    <button onclick="rankAction('update-points', {result:'draw'})" style="background:#555;">DRAW</button>
                    <button onclick="rankAction('update-points', {result:'loss'})" style="background:#222;">LOSS</button>
                </div>
                <input type="text" id="trophyInput" placeholder="Performance Title">
                <button onclick="updateTrophies()" class="btn-yellow">SAVE TROPHY</button>
                <div style="margin-top:15px; border-top:1px solid #222; padding-top:10px;">
                    <button onclick="resetAll()" class="btn-outline" style="font-size:0.7rem;">RESET ALL STATS</button>
                    <button onclick="deletePlayer()" class="btn-red" style="font-size:0.7rem; margin-top:5px;">DELETE PLAYER</button>
                </div>
            </div>

            <!-- 3. TOURNAMENTS -->
            <div class="card" style="border-left: 4px solid var(--accent);">
                <h3><i class="fa-solid fa-gamepad"></i> Tournaments</h3>
                <select id="tourSelect" onchange="fillTourForm()"><option value="">+ CREATE NEW</option></select>
                <input type="hidden" id="editId">
                <input type="text" id="tTitle" placeholder="Tournament Title">
                <input type="text" id="tTeams" placeholder="Teams Count">
                <select id="tStatus" onchange="toggleWinnerField()"><option value="Upcoming">Upcoming</option><option value="Live">Live</option><option value="Ended">Ended</option></select>
                <input type="text" id="tWinner" placeholder="Tournament Winner Name" style="display:none; border: 1px solid gold;">
                <input type="text" id="tPrize" placeholder="Prize Pool (e.g. ₹500 / 1000 FP)">
                <input type="text" id="tJoin" placeholder="WhatsApp Link">
                <input type="date" id="tDate">
                <button onclick="submitTour()" class="btn-yellow">Deploy</button>
                <button id="delBtn" onclick="deleteTour()" class="btn-red" style="display:none; font-size:0.8rem;">Delete Tournament</button>
            </div>

            <!-- 4. ROSTERS -->
            <div class="card" style="border-left: 4px solid #00ff88;">
                <h3><i class="fa-solid fa-users"></i> Rosters</h3>
                <select id="rosterTourSelect" onchange="loadRosterList()"><option value="">Select Tournament</option></select>
                <div id="rosterEditor" style="display:none;">
                    <input type="text" id="rosTeam" placeholder="Team Name">
                    <input type="text" id="rosPlayer" placeholder="Player Name">
                    <button onclick="addToRoster()" class="btn-blue">Add to Roster</button>
                    <div id="currentRoster" style="margin-top:10px; max-height:150px; overflow-y:auto; background:#000; border-radius:5px;"></div>
                </div>
            </div>

            <!-- 5. FIXTURES -->
            <div class="card" style="border-left: 4px solid var(--red);">
                <h3><i class="fa-solid fa-calendar-check"></i> Fixtures</h3>
                <select id="fixTourSelect" onchange="loadFixtureManager()"><option value="">Select Tournament</option></select>
                <div id="fixtureEditor" style="display:none;">
                    <input type="text" id="newStageName" placeholder="Stage Name">
                    <button onclick="manageFixture('add-stage')" class="btn-red">+ Add Stage</button>
                    <div id="stagesList" style="margin-top:10px;"></div>
                </div>
            </div>

            <!-- 6. BROADCAST -->
            <div class="card" style="border-left: 4px solid #ff00ff;">
                <h3><i class="fa-solid fa-bullhorn"></i> Broadcast</h3>
                <textarea id="annMsg" placeholder="Message to players..."></textarea>
                <button onclick="broadcast()" class="btn-blue" style="background:#ff00ff;">Push Announcement</button>
            </div>

            <!-- 7. NEWSLETTER -->
            <div class="card" style="border-left: 4px solid #ffaa00;">
                <h3><i class="fa-solid fa-envelope"></i> Newsletter</h3>
                <button onclick="loadSubscribers()" class="btn-outline">Show Subscribers</button>
                <div id="subList" style="margin-top:10px; font-family:monospace; color:#888;"></div>
            </div>

        </div>
    </div>

    <script>
        const API = "https://ml-server-uw6r.onrender.com/api";
        let toursData = [];

        function notify(msg, color = "#00ff88") {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.background = color;
            t.style.transform = "translateY(0)";
            setTimeout(() => { t.style.transform = "translateY(100px)"; }, 3000);
        }

        async function loadEverything() {
            try {
                const [pRes, tRes] = await Promise.all([
                    fetch(`${API}/player-list`).then(r => r.json()),
                    fetch(`${API}/manage-tournament`).then(r => r.json())
                ]);
                document.getElementById('playerSelect').innerHTML = pRes.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
                toursData = tRes;
                const opts = tRes.map(t => `<option value="${t._id}">${t.title}</option>`).join('');
                document.getElementById('tourSelect').innerHTML = '<option value="">+ CREATE NEW</option>' + opts;
                document.getElementById('rosterTourSelect').innerHTML = '<option value="">Select Tournament</option>' + opts;
                document.getElementById('fixTourSelect').innerHTML = '<option value="">Select Tournament</option>' + opts;
            } catch(e) { notify("Sync Failed", "red"); }
        }

        async function addPlayer() {
            const name = document.getElementById('newPlayerName').value.trim();
            const profilePic = document.getElementById('newPlayerImg').value.trim();
            const btn = document.getElementById('addPlayerBtn');
            if(!name) return alert("Name is required!");
            btn.innerText = "Syncing..."; btn.disabled = true;
            try {
                const res = await fetch(`${API}/add-player`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, profilePic })
                });
                const data = await res.json();
                if(res.ok) {
                    notify("Registered!");
                    document.getElementById('newPlayerName').value = "";
                    document.getElementById('newPlayerImg').value = "";
                    loadEverything();
                } else {
                    alert("Server Error: " + data.error);
                }
            } catch(err) {
                alert("Network Error: Could not connect to server.");
            } finally {
                btn.innerText = "Sync to Database"; btn.disabled = false;
            }
        }

        async function rankAction(endpoint, data) {
            const name = document.getElementById('playerSelect').value;
            await fetch(`${API}/${endpoint}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, ...data }) });
            notify("Updated!");
        }

        async function updateTrophies() {
            const name = document.getElementById('playerSelect').value;
            const trophies = document.getElementById('trophyInput').value;
            await fetch(`${API}/update-trophies`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, trophies }) });
            notify("Saved!");
        }

        async function resetAll() {
            if(prompt("Type 'mystic2024' to reset") === 'mystic2024') {
                await fetch(`${API}/reset-rankings`, { method: 'POST' });
                loadEverything();
            }
        }

        async function deletePlayer() {
            const name = document.getElementById('playerSelect').value;
            if(confirm(`Delete ${name}?`)) { await fetch(`${API}/delete-player-safe`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) }); loadEverything(); }
        }

        // --- TOURNAMENT FUNCTIONS (UPDATED) ---
        function toggleWinnerField() {
            const status = document.getElementById('tStatus').value;
            document.getElementById('tWinner').style.display = (status === 'Ended') ? 'block' : 'none';
        }

        function fillTourForm() {
            const id = document.getElementById('tourSelect').value;
            if(!id) { 
                document.getElementById('editId').value = ""; 
                document.getElementById('delBtn').style.display="none"; 
                document.getElementById('tWinner').style.display="none";
                document.querySelectorAll('#tTitle, #tTeams, #tWinner, #tPrize, #tJoin, #tDate').forEach(i => i.value = "");
                return; 
            }
            const t = toursData.find(x => x._id === id);
            document.getElementById('editId').value = t._id;
            document.getElementById('tTitle').value = t.title || "";
            document.getElementById('tTeams').value = t.totalTeams || "";
            document.getElementById('tStatus').value = t.status || "Upcoming";
            document.getElementById('tWinner').value = t.winner || "";
            document.getElementById('tPrize').value = t.prize || "";
            document.getElementById('tJoin').value = t.joinLink || "";
            document.getElementById('tDate').value = t.date || "";
            document.getElementById('delBtn').style.display="block";
            toggleWinnerField();
        }

        async function submitTour() {
            const id = document.getElementById('editId').value;
            const data = { 
                title: document.getElementById('tTitle').value, 
                totalTeams: document.getElementById('tTeams').value, 
                status: document.getElementById('tStatus').value, 
                winner: document.getElementById('tWinner').value, 
                prize: document.getElementById('tPrize').value,          
                joinLink: document.getElementById('tJoin').value, 
                date: document.getElementById('tDate').value 
            };
            const endpoint = id ? 'update-tournament' : 'manage-tournament';
            await fetch(`${API}/${endpoint}`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(id ? {id, data} : data) 
            });
            notify("Tournament Saved!"); 
            loadEverything();
        }

        async function deleteTour() {
            if(confirm("Delete Tournament?")) { 
                await fetch(`${API}/delete-tournament`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ id: document.getElementById('editId').value }) 
                }); 
                loadEverything(); 
            }
        }

        async function loadRosterList() {
            const id = document.getElementById('rosterTourSelect').value;
            if(!id) { document.getElementById('rosterEditor').style.display="none"; return; }
            document.getElementById('rosterEditor').style.display="block";
            const t = toursData.find(x => x._id === id);
            document.getElementById('currentRoster').innerHTML = (t.roster || []).map(team => `<div style="padding:8px; border-bottom:1px solid #222; display:flex; justify-content:space-between;"><span><b>${team.teamName}</b>: ${team.players.join(', ')}</span><i class="fa-solid fa-trash" onclick="removeTeam('${team._id}')" style="color:red; cursor:pointer;"></i></div>`).join('');
        }

        async function addToRoster() {
            const tourId = document.getElementById('rosterTourSelect').value;
            const teamName = document.getElementById('rosTeam').value;
            const playerName = document.getElementById('rosPlayer').value;
            await fetch(`${API}/update-roster`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tourId, teamName, playerName, action: 'add' }) });
            loadEverything(); setTimeout(loadRosterList, 500);
        }

        async function removeTeam(teamId) {
            await fetch(`${API}/update-roster`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tourId: document.getElementById('rosterTourSelect').value, teamId, action: 'remove-team' }) });
            loadEverything(); setTimeout(loadRosterList, 500);
        }

        async function loadFixtureManager() {
            const id = document.getElementById('fixTourSelect').value;
            if(!id) { document.getElementById('fixtureEditor').style.display="none"; return; }
            document.getElementById('fixtureEditor').style.display="block";
            const t = toursData.find(x => x._id === id);
            document.getElementById('stagesList').innerHTML = (t.fixtures || []).map(stage => `
                <div style="background:#1a1a1a; padding:10px; border-radius:8px; margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between; color:var(--red);"><b>${stage.stageName}</b><i class="fa-solid fa-trash" onclick="manageFixture('delete-stage', {stageId:'${stage._id}'})"></i></div>
                    ${stage.matches.map(m => `<div style="display:grid; grid-template-columns: 1fr 40px 10px 40px 1fr 30px; gap:5px; margin-top:5px; align-items:center;">
                        <span style="font-size:0.7rem; text-align:right;">${m.p1}</span>
                        <input type="text" value="${m.s1}" id="s1_${m._id}" style="padding:2px; text-align:center; margin:0;">
                        <span>-</span>
                        <input type="text" value="${m.s2}" id="s2_${m._id}" style="padding:2px; text-align:center; margin:0;">
                        <span style="font-size:0.7rem;">${m.p2}</span>
                        <button onclick="updateScore('${stage._id}','${m._id}')" style="background:var(--green); color:black; padding:2px; margin:0;"><i class="fa-solid fa-save"></i></button>
                    </div>`).join('')}
                    <div style="display:grid; grid-template-columns: 1fr 1fr 40px; gap:5px; margin-top:10px;">
                        <input type="text" id="p1_${stage._id}" placeholder="P1" style="margin:0;"><input type="text" id="p2_${stage._id}" placeholder="P2" style="margin:0;">
                        <button onclick="addMatch('${stage._id}')" style="background:#444; margin:0;">+</button>
                    </div>
                </div>`).join('');
        }

        async function manageFixture(action, extra) { await fetch(`${API}/update-fixtures`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tourId: document.getElementById('fixTourSelect').value, stageName: document.getElementById('newStageName').value, action, ...extra }) }); loadEverything(); setTimeout(loadFixtureManager, 500); }
        async function addMatch(stageId) { await fetch(`${API}/update-fixtures`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tourId: document.getElementById('fixTourSelect').value, stageId, action: 'add-match', matchData: { p1: document.getElementById(`p1_${stageId}`).value, p2: document.getElementById(`p2_${stageId}`).value } }) }); loadEverything(); setTimeout(loadFixtureManager, 500); }
        async function updateScore(stageId, matchId) { await fetch(`${API}/update-fixtures`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tourId: document.getElementById('fixTourSelect').value, stageId, matchId, action: 'update-score', matchData: { s1: document.getElementById(`s1_${matchId}`).value, s2: document.getElementById(`s2_${matchId}`).value } }) }); notify("Score Saved"); }

        async function broadcast() { await fetch(`${API}/announcement`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: document.getElementById('annMsg').value }) }); notify("Sent!"); document.getElementById('annMsg').value=""; }
        async function loadSubscribers() { const r = await fetch(`${API}/subscribers`); const d = await r.json(); document.getElementById('subList').innerText = d.map(s => s.email).join(', '); }

        window.onload = loadEverything;
    </script>
</body>
</html>
