<!-- rankings.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Global Rankings | Mystic Legends</title>
    <link rel="stylesheet" href="stylef.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
    :root {
        --accent-yellow: #f8d448;
        --neon-green: #00ff88;
        --glass-white: rgba(255, 255, 255, 0.03);
    }

    body { background: #050505; color: white; padding-top: 80px; font-family: 'Rajdhani', sans-serif; }
    .ranking-container { max-width: 950px; margin: 0 auto; padding: 15px; }

    /* --- THE TABLE --- */
    .leaderboard-table { 
        width: 100%; 
        border-collapse: separate; 
        border-spacing: 0 8px; 
        backdrop-filter: blur(15px);
        table-layout: fixed; /* Keeps columns stable */
    }

    .leaderboard-table th { 
        padding: 15px; 
        color: var(--accent-yellow); 
        text-transform: uppercase; 
        font-size: 0.8rem; 
        text-align: left;
    }

    /* --- PLAYER ROWS --- */
    .player-row { background: var(--glass-white); transition: 0.3s; }
    
    /* Gold, Silver, Bronze Highlights */
    .player-row:nth-child(1) { 
        background: linear-gradient(90deg, rgba(255, 215, 0, 0.1) 0%, transparent 100%); 
        border-left: 4px solid #FFD700; 
    }
    .player-row:nth-child(2) { 
        background: linear-gradient(90deg, rgba(192, 192, 192, 0.1) 0%, transparent 100%); 
        border-left: 4px solid #C0C0C0; 
    }
    .player-row:nth-child(3) { 
        background: linear-gradient(90deg, rgba(205, 127, 50, 0.1) 0%, transparent 100%); 
        border-left: 4px solid #CD7F32; 
    }

    .player-row td { padding: 10px 15px; vertical-align: middle; font-weight: 700; }

    /* --- THE AVATAR (STRICT FIX) --- */
    .p-avatar {
        width: 45px !important;
        height: 45px !important;
        min-width: 45px !important;
        min-height: 45px !important;
        border-radius: 50%;
        object-fit: cover; /* Important: prevents squashing */
        border: 2px solid var(--accent-yellow);
        margin-right: 12px;
        background: #111;
        display: inline-block;
    }

    /* Flex container for Name + Photo */
    .striker-cell {
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .rank-num { font-style: italic; color: #888; width: 40px; }
    .pts-cell { color: var(--accent-yellow); font-size: 1.3rem; text-align: right; }

    /* Header Nav */
    .nav-header {
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; 
        background: #111; 
        padding: 10px 20px; 
        border-radius: 10px;
    }

    @media (max-width: 768px) {
        .ranking-container { padding: 5px; }
        .leaderboard-table th, .player-row td { padding: 8px 10px; font-size: 0.9rem; }
        .p-avatar { width: 35px !important; height: 35px !important; min-width: 35px; min-height: 35px; }
    }
    </style>
</head>
<body>

    <div class="ranking-container">
        <div style="text-align: center; margin-bottom: 40px;" data-aos="fade-down">
            <h1 style="margin:0;">MYSTIC <span style="color:var(--accent-yellow)">RANKINGS</span></h1>
            <div style="color:#555; letter-spacing:4px; font-size:0.8rem;">THE GLOBAL ELITE</div>
        </div>
        
        <div class="nav-header" data-aos="fade-in">
            <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;"><i class="fa-solid fa-house"></i> HOME</a>
            <button onclick="exportToPDF()" class="view-all-btn" style="padding: 8px 20px; font-size: 0.7rem;">EXPORT PDF</button>
        </div>

        <table class="leaderboard-table" data-aos="fade-up">
            <thead>
                <tr>
                    <th width="80">#</th>
                    <th>STRIKER</th>
                    <th style="text-align:center;">GS</th>
                    <th style="text-align:center;">GA</th>
                    <th style="text-align:right;">PTS</th>
                </tr>
            </thead>
            <tbody id="ranking-body">
                <!-- Data injected here -->
            </tbody>
        </table>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        const API = "https://ml-server-uw6r.onrender.com/api";
        async function loadRankings() {
            const tbody = document.getElementById('ranking-body');
            try {
                const response = await fetch(`${API}/rankings`);
                const players = await response.json();
                tbody.innerHTML = players.map((player, index) => `
                    <tr class="player-row">
                        <td class="rank-num">${index + 1}</td>
                        <td style="display: flex; align-items: center;">
                            <img src="${player.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="p-avatar">
                            <span>${player.name} ${index === 0 ? '👑' : ''}</span>
                        </td>
                        <td style="text-align:center; color:var(--neon-green);">${player.goalsFor || 0}</td>
                        <td style="text-align:center; color:#ff4444;">${player.goalsAgainst || 0}</td>
                        <td class="pts-cell" style="text-align:right;">${player.points}</td>
                    </tr>`).join('');
            } catch (error) { }
        }
        loadRankings();
        // (Keep your PDF Export function exactly as it was)
    </script>
</body>
</html>
