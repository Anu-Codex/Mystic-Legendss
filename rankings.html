<!-- rankings.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Global Rankings | Mystic Legends</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        /* Gold, Silver, Bronze highlights */
        .player-row:nth-child(1) { background: linear-gradient(90deg, rgba(228, 255, 0, 0.15) 0%, transparent 100%); border-left: 4px solid gold; }
        .player-row:nth-child(2) { border-left: 4px solid silver; }
        .player-row:nth-child(3) { border-left: 4px solid #cd7f32; }
        .p-avatar { border: 2px solid var(--accent-yellow); box-shadow: 0 0 10px rgba(228, 255, 0, 0.2); }
        .leaderboard-table { backdrop-filter: blur(15px); background: rgba(255,255,255,0.01); }
        /* FIX: Restrict Image Size and Table Layout */
.p-avatar {
    width: 50px !important;    /* Forces small size */
    height: 50px !important;   /* Forces small size */
    min-width: 50px;
    min-height: 50px;
    border-radius: 50%;        /* Makes it a circle */
    object-fit: cover;         /* Prevents stretching */
    margin-right: 15px;
    border: 2px solid var(--accent-yellow);
    display: block;
}

.player-row td {
    padding: 15px !important;
    vertical-align: middle !important;
}

/* Ensures the name and photo stay on one line */
.player-row td:nth-child(2) {
    display: flex;
    align-items: center;
    min-width: 250px;
}

/* Prevents the table from expanding too wide */
.leaderboard-table {
    table-layout: fixed;
    width: 100%;
}
    </style>
</head>
<body>

    <div class="ranking-container">
        <div style="text-align: center; margin-bottom: 40px;" data-aos="fade-down">
            <h1 style="margin:0;">MYSTIC <span style="color:var(--accent-yellow)">RANKINGS</span></h1>
            <div style="color:#555; letter-spacing:4px; font-size:0.8rem;">THE GLOBAL ELITE</div>
        </div>
        
        <div class="nav-header" data-aos="fade-in">
            <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;"><i class="fa-solid fa-house"></i> HOME</a>
            <button onclick="exportToPDF()" class="view-all-btn" style="padding: 8px 20px; font-size: 0.7rem;">EXPORT PDF</button>
        </div>

        <table class="leaderboard-table" data-aos="fade-up">
            <thead>
                <tr>
                    <th width="80">#</th>
                    <th>STRIKER</th>
                    <th style="text-align:center;">GS</th>
                    <th style="text-align:center;">GA</th>
                    <th style="text-align:right;">PTS</th>
                </tr>
            </thead>
            <tbody id="ranking-body">
                <!-- Data injected here -->
            </tbody>
        </table>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        const API = "https://ml-server-uw6r.onrender.com/api";
        async function loadRankings() {
            const tbody = document.getElementById('ranking-body');
            try {
                const response = await fetch(`${API}/rankings`);
                const players = await response.json();
                tbody.innerHTML = players.map((player, index) => `
                    <tr class="player-row">
                        <td class="rank-num">${index + 1}</td>
                        <td style="display: flex; align-items: center;">
                            <img src="${player.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="p-avatar">
                            <span>${player.name} ${index === 0 ? '👑' : ''}</span>
                        </td>
                        <td style="text-align:center; color:var(--neon-green);">${player.goalsFor || 0}</td>
                        <td style="text-align:center; color:#ff4444;">${player.goalsAgainst || 0}</td>
                        <td class="pts-cell" style="text-align:right;">${player.points}</td>
                    </tr>`).join('');
            } catch (error) { }
        }
        loadRankings();
        // (Keep your PDF Export function exactly as it was)
    </script>
</body>
</html>
