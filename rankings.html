<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Global Rankings | Mystic Legends</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- PDF LIBRARIES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --accent-yellow: #f8d448;
            --neon-green: #00ff88;
            --glass-white: rgba(255, 255, 255, 0.03);
        }

        body { background: #050505; color: white; padding-top: 80px; font-family: 'Rajdhani', sans-serif; }
        .ranking-container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        /* --- THE TABLE --- */
        .leaderboard-table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0 8px; 
            backdrop-filter: blur(15px);
        }

        .leaderboard-table th { 
            padding: 15px; 
            color: var(--accent-yellow); 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            text-align: left;
            border-bottom: 1px solid #222;
        }

        .player-row { background: var(--glass-white); transition: 0.3s; }
        
        .player-row:nth-child(1) { background: linear-gradient(90deg, rgba(255, 215, 0, 0.15) 0%, transparent 100%); border-left: 4px solid #FFD700; }
        .player-row:nth-child(2) { background: linear-gradient(90deg, rgba(192, 192, 192, 0.1) 0%, transparent 100%); border-left: 4px solid #C0C0C0; }
        .player-row:nth-child(3) { background: linear-gradient(90deg, rgba(205, 127, 50, 0.1) 0%, transparent 100%); border-left: 4px solid #CD7F32; }

        .player-row td { padding: 10px 15px; vertical-align: middle; font-weight: 700; }

        .p-avatar {
            width: 45px !important; height: 45px !important;
            min-width: 45px !important; min-height: 45px !important;
            border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent-yellow); margin-right: 12px;
            background: #111; display: inline-block;
        }

        .striker-cell { display: flex; align-items: center; }
        .striker-cell span { color: white; cursor: pointer; transition: 0.2s; }
        .striker-cell span:hover { color: var(--accent-yellow); text-shadow: 0 0 10px var(--accent-yellow); }

        .rank-num { font-style: italic; color: #888; width: 40px; }
        .pts-cell { color: var(--accent-yellow); font-size: 1.3rem; text-align: right; }
        .perf-cell { color: #aaa; font-size: 0.85rem; font-style: italic; }

        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #111; padding: 10px 20px; border-radius: 10px; }
        .export-btn { background: var(--accent-yellow); color: black; padding: 8px 15px; font-weight: 800; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); border: none; cursor: pointer; font-family: inherit; }

        /* --- FUT CARD STYLES --- */
        .card-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .fut-card { width: 300px; height: 450px; background: linear-gradient(145deg, #f8d448, #9e7a10); position: relative; clip-path: polygon(50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%, 0% 15%); box-shadow: 0 0 50px rgba(248, 212, 72, 0.3); color: #111; padding: 20px; text-align: center; }
        .card-ovr { font-size: 3rem; font-weight: 900; margin: 20px 0 0; }
        .card-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #111; margin: 10px auto; }
        .card-name { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; }
        .card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; font-weight: 800; }
        .stat-item { display: flex; flex-direction: column; font-size: 0.9rem; }
        .stat-lbl { font-size: 0.6rem; opacity: 0.7; }
        .card-toty { background: linear-gradient(145deg, #0041FF, #001a4d); color: white; }

        @media (max-width: 768px) {
            .leaderboard-table th, .player-row td { padding: 8px 10px; font-size: 0.8rem; }
            .p-avatar { width: 35px !important; height: 35px !important; }
            .perf-cell, .perf-header { display: none; }
        }
    </style>
</head>
<body>

    <div class="ranking-container">
        <div style="text-align: center; margin-bottom: 30px;" data-aos="fade-down">
            <h1 style="margin:0; letter-spacing: 2px;">MYSTIC <span style="color:var(--accent-yellow)">RANKINGS</span></h1>
            <div style="color:#555; letter-spacing:4px; font-size:0.8rem; text-transform: uppercase;">The Global Elite</div>
        </div>
        
        <div class="nav-header">
            <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;"><i class="fa-solid fa-house"></i> HOME</a>
            <button onclick="exportToPDF()" class="export-btn">EXPORT PDF</button>
        </div>

        <table class="leaderboard-table" data-aos="fade-up">
            <thead>
                <tr>
                    <th width="50">#</th>
                    <th>STRIKER</th>
                    <th style="text-align:center;">GS</th>
                    <th style="text-align:center;">GA</th>
                    <th class="perf-header">PERFORMANCE</th>
                    <th style="text-align:right;">PTS</th>
                </tr>
            </thead>
            <tbody id="ranking-body">
                <tr><td colspan="6" style="text-align:center; padding:40px;">Syncing with Arena...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- PLAYER CARD MODAL -->
    <div id="playerCardOverlay" class="card-overlay" onclick="closeCard(event)">
        <div class="fut-card" id="futCard">
            <div class="card-ovr" id="ovrVal">99</div>
            <div style="font-weight:700; font-size:0.8rem;">STRIKER</div>
            <img id="cardPic" src="" class="card-img">
            <div class="card-name" id="cardName">PLAYER NAME</div>
            <div class="card-stats">
                <div class="stat-item"><span id="statWins">0</span><span class="stat-lbl">WINS</span></div>
                <div class="stat-item"><span id="statGS">0</span><span class="stat-lbl">GS</span></div>
                <div class="stat-item"><span id="statGA">0</span><span class="stat-lbl">GA</span></div>
                <div class="stat-item"><span id="statPTS">0</span><span class="stat-lbl">PTS</span></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        const API = "https://ml-server-uw6r.onrender.com/api";

        async function loadRankings() {
            const tbody = document.getElementById('ranking-body');
            try {
                const response = await fetch(`${API}/rankings`);
                const players = await response.json();
                
                if (players.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">No strikers found.</td></tr>';
                    return;
                }

                tbody.innerHTML = players.map((player, index) => {
                    const pic = player.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                    const performance = player.trophies || '-';
                    return `
                    <tr class="player-row">
                        <td class="rank-num">${index + 1}</td>
                        <td class="striker-cell">
                            <img src="${pic}" class="p-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
                            <span onclick="openCard('${player.name}')">${player.name} ${index === 0 ? '👑' : ''}</span>
                        </td>
                        <td style="text-align:center; color:var(--neon-green);">${player.goalsFor || 0}</td>
                        <td style="text-align:center; color:#ff4444;">${player.goalsAgainst || 0}</td>
                        <td class="perf-cell">${performance}</td>
                        <td class="pts-cell">${player.points}</td>
                    </tr>`;
                }).join('');
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Connection Error</td></tr>';
            }
        }

        async function openCard(playerName) {
            try {
                const res = await fetch(`${API}/player/${playerName}`);
                const p = await res.json();
                const ovr = Math.min(99, 75 + (p.wins * 2) + Math.floor(p.points / 5));
                
                document.getElementById('ovrVal').innerText = ovr;
                document.getElementById('cardName').innerText = p.name;
                document.getElementById('statWins').innerText = p.wins;
                document.getElementById('statGS').innerText = p.goalsFor || 0;
                document.getElementById('statGA').innerText = p.goalsAgainst || 0;
                document.getElementById('statPTS').innerText = p.points;
                document.getElementById('cardPic').src = p.profilePic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

                const card = document.getElementById('futCard');
                card.className = "fut-card";
                if(ovr >= 95) card.classList.add('card-toty');

                document.getElementById('playerCardOverlay').style.display = 'flex';
                document.body.style.overflow = 'hidden';
            } catch(e) { console.log("Card error"); }
        }

        function closeCard(e) {
            if(e.target.id === "playerCardOverlay") {
                document.getElementById('playerCardOverlay').style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(10, 10, 10);
            doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(248, 212, 72); 
            doc.setFontSize(22);
            doc.text("MYSTIC LEGENDS RANKINGS", 14, 20);
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(10);
            doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 28);
            doc.autoTable({
                html: '.leaderboard-table',
                startY: 35,
                theme: 'grid',
                headStyles: { fillColor: [248, 212, 72], textColor: [0, 0, 0] },
                styles: { fillColor: [20, 20, 20], textColor: [255, 255, 255] }
            });
            doc.save("Mystic_Legends_Rankings.pdf");
        }

        loadRankings();
    </script>
</body>
</html>
