<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame | Mystic Legends</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hof-container { padding: 100px 5% 50px; max-width: 1200px; margin: 0 auto; text-align: center; }
        .museum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; margin-top: 50px; }
        
        /* PREMIUM TROPHY CARD */
        .legacy-card {
            background: linear-gradient(145deg, #1a1a1a, #000);
            border: 2px solid gold;
            padding: 30px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            transition: 0.5s;
        }
        .legacy-card:hover { transform: scale(1.05) translateY(-10px); box-shadow: 0 0 50px rgba(255, 215, 0, 0.4); }

        .winner-img {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 4px solid gold;
            object-fit: cover;
            margin: 0 auto 20px;
            background: #111;
        }

        .tour-name { color: #888; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; }
        .champ-name { color: white; font-size: 1.8rem; font-weight: 800; margin: 10px 0; }
        .stat-badge { background: gold; color: black; padding: 4px 12px; font-weight: 900; border-radius: 4px; display: inline-block; font-size: 0.7rem; }
        
        /* Golden Shine Animation */
        .legacy-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,215,0,0.1), transparent);
            transform: rotate(45deg); animation: shine 4s infinite;
        }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
    </style>
</head>
<body>
    <header>
        <div class="logo">MYSTIC <span>LEGENDS</span></div>
        <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;"><i class="fa-solid fa-house"></i> HOME</a>
    </header>

    <div class="hof-container">
        <h1 style="font-size: 4rem; color: gold; text-transform: uppercase; letter-spacing: 5px;">HALL OF <br><span>FAME</span></h1>
        <p style="color:#555;">CELEBRATING THE IMMORTAL CHAMPIONS OF THE ARENA</p>

        <div id="legacyGrid" class="museum-grid">
            <p>Consulting the Archives...</p>
        </div>
    </div>

    <script>
        async function loadLegacy() {
            try {
                const res = await fetch('https://ml-server-uw6r.onrender.com/api/legacy');
                const data = await res.json();
                const container = document.getElementById('legacyGrid');

                if(data.length === 0) {
                    container.innerHTML = "<p style='color:#444;'>The Hall is currently empty. Who will be the first legend?</p>";
                    return;
                }

                container.innerHTML = data.map(l => `
                    <div class="legacy-card">
                        <div class="stat-badge">OFFICIAL CHAMPION</div>
                        <img src="${l.playerPic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="winner-img">
                        <div class="tour-name">${l.tournamentTitle}</div>
                        <div class="champ-name">${l.playerName}</div>
                        <div style="color:gold; font-weight:bold; letter-spacing:1px;">${l.score}</div>
                        <div style="color:#444; font-size:0.7rem; margin-top:15px;">INDUCTED: ${l.date}</div>
                    </div>
                `).join('');
            } catch(e) { console.log("Error loading archives"); }
        }
        window.onload = loadLegacy;
    </script>
</body>
</html>
